name: check

# Check the live site's URL behavior, and that every link on the front page
# (as proposed, on a pull request) resolves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .tests/check.py
